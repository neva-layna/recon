spring:
  config:
    import: "classpath:/recon-yaml/kafka-brokers.yml"

recon:
  input-roots:
    - /yaml/root-a
    - /yaml/root-b
  metadata-column: yaml_meta
  date-partition-column: business_date
  run-date: "2026-07-05"
  normalized-offsets-path: file:///tmp/yaml-normalized
  normalized-offsets-overwrite: false
  fail-on-invalid-rows: false
  fail-on-gaps: false
  missing-offsets-limit: 7
  exit-on-completion: false
  source-topic: yaml-orders
  kafka-alias: main-kafka
  canary-topic: yaml-orders-canary
  dead-letter-topic: yaml-orders-dlq
  side-topic-starting-offsets: beginning
