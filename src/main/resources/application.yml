# Sample YAML configuration for the Java spark-submit checker.
# The checker is a Spring Boot 2.7.18 application. YAML under `recon` is the
# preferred operator config source; Spark conf values (`recon.*` and
# `spark.recon.*`) override these settings.
#
# Base parquet-gap configuration. For Java side-topic reconciliation, import a
# colocated broker alias file:
#
# spring:
#   config:
#     import: "file:./kafka-brokers.yml"
#
# recon:
#   input-roots:
#     - hdfs:///warehouse/orders/root-a
#     - hdfs:///warehouse/orders/root-b
#   metadata-column: cactus__metadata
#   date-partition-column: timestampcolumn
#   run-date: "2026-07-02"
#   normalized-offsets-path: hdfs:///tmp/recon-normalized-orders
#   normalized-offsets-overwrite: true
#   fail-on-invalid-rows: true
#   fail-on-gaps: true
#   missing-offsets-limit: 1000
#   exit-on-completion: true
#
# Optional Java-only Kafka 3.x side-topic reconciliation settings. Keep these
# under the same `recon` block when canary/dead-letter topics explain missing
# parquet offsets. The Scala spark-shell checker does not read these settings.
#
#   source-topic: orders
#   kafka-alias: main-kafka
#   canary-topic: orders-canary
#   dead-letter-topic: orders-dlq
#   side-topic-starting-offsets: earliest
#
# Example kafka-brokers.yml:
#
# kafka-configs:
#   broker:
#     main-kafka:
#       conf:
#         "[bootstrap.servers]": broker-a:9092,broker-b:9092
#         "[security.protocol]": PLAINTEXT
#         "[max.poll.records]": 500
