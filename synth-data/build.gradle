plugins {
    id 'java'
    id 'application'
}

group = 'com.reconciliation'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    mainClass = 'com.reconciliation.synthdata.SynthDataCli'
}

dependencies {
    implementation 'org.apache.avro:avro:1.11.4'
    implementation 'org.apache.kafka:kafka-clients:3.7.0'
    implementation 'org.apache.parquet:parquet-avro:1.13.1'
    implementation 'org.apache.hadoop:hadoop-common:3.3.4'
    implementation('org.apache.hadoop:hadoop-mapreduce-client-core:3.3.4') {
        transitive = false
    }
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 8
    }
}

tasks.register('cliSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the no-dependency synthetic data smoke test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.reconciliation.synthdata.SyntheticRecordGeneratorSmokeTest'
}

tasks.register('kafkaPayloadSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Builds and decodes canary/dead-letter Avro object-container payloads.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.reconciliation.synthdata.KafkaSideTopicPayloadSmokeTest'
}

tasks.register('kafkaPayloadFileDecode', JavaExec) {
    group = 'verification'
    description = 'Decodes one side-topic Avro object-container payload file.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.reconciliation.synthdata.KafkaSideTopicPayloadFileDecodeCheck'
}

tasks.register('kafkaBrokerDecodeCheck', JavaExec) {
    group = 'verification'
    description = 'Consumes one side-topic Kafka record and decodes its Avro payload.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.reconciliation.synthdata.KafkaSideTopicBrokerDecodeCheck'
}

tasks.named('test') {
    dependsOn tasks.named('cliSmokeTest')
    dependsOn tasks.named('kafkaPayloadSmokeTest')
}

tasks.named('check') {
    dependsOn tasks.named('cliSmokeTest')
    dependsOn tasks.named('kafkaPayloadSmokeTest')
}
